{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CronicCare — Acceso Denegado</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="font-sans bg-bg text-text flex items-center justify-center min-h-screen">
  <div class="bg-surface rounded-2xl border border-border p-14 text-center w-full max-w-115 shadow-md">

    <div class="w-16 h-16 bg-alert-light rounded-full flex items-center justify-center mx-auto mb-5">
      <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" class="text-alert">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <h1 class="text-[1.4rem] font-black text-alert tracking-wide mb-3">Acceso Denegado</h1>

    <p class="text-muted text-[0.875rem] leading-[1.7] mb-9">
      No tienes permisos asignados a tu cuenta.<br>
      Contacta al administrador del sistema.
    </p>

    <form method="POST" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit" class="bg-transparent text-primary border-[1.5px] border-primary px-7 py-2.5 rounded-lg font-semibold text-[0.875rem] font-sans cursor-pointer transition-[background] duration-200 hover:bg-primary-light">Cerrar Sesión</button>
    </form>

  </div>
</body>
</html>
