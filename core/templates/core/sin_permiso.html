<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CronicCare — Acceso Denegado</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:            #F8FAFC;
      --surface:       #FFFFFF;
      --primary:       #1E40AF;
      --primary-light: #EFF6FF;
      --text:          #0F172A;
      --text2:         #334155;
      --muted:         #64748B;
      --border:        #E2E8F0;
      --alert:         #DC2626;
      --alert-light:   #FEE2E2;
      --shadow-md:     0 4px 6px rgba(0,0,0,0.07), 0 2px 4px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .center-card {
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 56px 48px;
      text-align: center;
      width: 100%;
      max-width: 460px;
      box-shadow: var(--shadow-md);
    }

    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      padding: 10px 28px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.875rem;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-outline:hover { background: var(--primary-light); }
  </style>
</head>
<body>
  <div class="center-card">

    <div style="width: 64px; height: 64px; background: var(--alert-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
      <svg width="28" height="28" fill="none" stroke="var(--alert)" stroke-width="2" viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <h1 style="font-size: 1.4rem; font-weight: 800; color: var(--alert); letter-spacing: -0.03em; margin-bottom: 12px;">
      Acceso Denegado
    </h1>

    <p style="color: var(--muted); font-size: 0.875rem; line-height: 1.7; margin-bottom: 36px;">
      No tienes permisos asignados a tu cuenta.<br>
      Contacta al administrador del sistema.
    </p>

    <form method="POST" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit" class="btn-outline">Cerrar Sesión</button>
    </form>

  </div>
</body>
</html>
