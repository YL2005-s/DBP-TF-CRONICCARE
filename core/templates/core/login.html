<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CronicCare — Iniciar Sesión</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:            #F8FAFC;
      --surface:       #FFFFFF;
      --primary:       #1E40AF;
      --primary2:      #1D4ED8;
      --primary-light: #EFF6FF;
      --text:          #0F172A;
      --text2:         #334155;
      --muted:         #64748B;
      --border:        #E2E8F0;
      --alert:         #DC2626;
      --alert-light:   #FEE2E2;
      --shadow-md:     0 4px 6px rgba(0,0,0,0.07), 0 2px 4px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-md);
    }

    .form-input {
      width: 100%;
      padding: 11px 14px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: var(--primary2); }
  </style>
</head>
<body>

  <!-- Logo -->
  <div style="text-align: center; margin-bottom: 28px;">
    <div style="font-size: 1.6rem; font-weight: 800; color: var(--primary); letter-spacing: -0.04em; margin-bottom: 6px;">
      CronicCare
    </div>
    <p style="font-size: 0.82rem; color: var(--muted); font-weight: 500;">Telemonitoreo de Pacientes Crónicos</p>
  </div>

  <div class="card">
    <h2 style="font-weight: 700; font-size: 1.2rem; letter-spacing: -0.03em; color: var(--text); margin-bottom: 8px;">
      Acceso al Sistema
    </h2>
    <p style="font-size: 0.8rem; color: var(--muted); margin-bottom: 24px;">
      Ingrese su DNI y contraseña para acceder al sistema.
    </p>

    {% if form.errors %}
    <div style="margin-bottom: 20px; padding: 12px 16px; border-radius: 8px; background: var(--alert-light); border: 1px solid #fca5a5; display: flex; align-items: flex-start; gap: 10px;">
      <svg width="16" height="16" fill="none" stroke="var(--alert)" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink: 0; margin-top: 1px;">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <div>
        <p style="color: var(--alert); font-size: 0.8rem; font-weight: 700; margin-bottom: 2px;">DNI o contraseña incorrectos</p>
        <p style="color: var(--alert); font-size: 0.75rem; opacity: 0.85;">DNI o contraseña incorrectos. Verifique sus credenciales.</p>
      </div>
    </div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <div style="margin-bottom: 18px;">
        <label style="display: block; font-size: 0.78rem; font-weight: 600; color: var(--text2); margin-bottom: 7px;">
          DNI
        </label>
        <input type="text" name="username" autofocus required
               placeholder="Ingrese su DNI (8 dígitos)"
               inputmode="numeric"
               pattern="[0-9]{8}"
               title="Ingrese su DNI de 8 dígitos numéricos"
               maxlength="8"
               minlength="8"
               class="form-input">
      </div>

      <div style="margin-bottom: 26px;">
        <label style="display: block; font-size: 0.78rem; font-weight: 600; color: var(--text2); margin-bottom: 7px;">
          Contraseña
        </label>
        <input type="password" name="password" required placeholder="••••••••" class="form-input">
      </div>

      <button type="submit" class="btn-primary">Ingresar al Sistema</button>
    </form>
  </div>

  <script>
    document.querySelector('input[name="username"]')
      .addEventListener('input', function() {
        this.value = this.value.replace(/[^0-9]/g, '').slice(0, 8);
      });
  </script>

</body>
</html>
